name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Unzip and Build
        run: |
          # چک کردن اینکه فایل زیپ وجود دارد یا خیر
          if [ -f "HoshbanManager.zip" ]; then
            unzip -o HoshbanManager.zip -d project_root
            if [ -d "project_root/HoshbanManager" ]; then
              mv project_root/HoshbanManager/* .
            elif [ -d "project_root/HoshbanManagerV2" ]; then
              mv project_root/HoshbanManagerV2/* .
            else
              mv project_root/* .
            fi
          fi
          
          # اجرای Gradle بدون نیاز به فایل gradlew
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hoshban-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk